---
- name: Base packages for all servers
  hosts: all
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600

- name: Configure PostgreSQL database server
  hosts: db
  become: true
  vars:
    db_name: notes
    db_user: notes
    db_password: notes_password
  tasks:
    - name: Install PostgreSQL and psycopg2
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present

    - name: Listen on all addresses
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/postgresql.conf
        regexp: '^#?listen_addresses\s*='
        line: "listen_addresses = '*'"
      notify: Restart PostgreSQL

    - name: Allow network connections in pg_hba.conf
      ansible.builtin.lineinfile:
        path: /etc/postgresql/17/main/pg_hba.conf
        regexp: '^host\s+all\s+all\s+0\.0\.0\.0/0'
        line: 'host all all 0.0.0.0/0 scram-sha-256'
      notify: Restart PostgreSQL

    - name: Ensure PostgreSQL is started
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Create database user
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        state: present
      become_user: postgres

    - name: Create database
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        state: present
      become_user: postgres

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: Configure web servers
  hosts: web
  become: true
  vars:
    database_url: "postgresql://notes:notes_password@db:5432/notes"
  tasks:
    - name: Install web server dependencies
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present

    - name: Clone or update notes repository
      ansible.builtin.git:
        repo: "https://github.com/Hmmagf/devops-labs-fn373223044.git"
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Install Python dependencies into virtualenv
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Deploy systemd unit for notes service
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
        mode: "0644"
      notify: Restart notes

    - name: Ensure notes service is started and enabled
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted
        daemon_reload: true

- name: Configure load balancer
  hosts: lb
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Deploy nginx load balancer configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/sites-available/default
        mode: "0644"
      notify: Reload nginx

    - name: Ensure nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
