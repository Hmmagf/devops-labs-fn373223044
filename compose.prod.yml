services:
  app:
    image: ghcr.io/hmmagf/devops-labs-fn373223044:${APP_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://notes:notes@db:5432/notes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
